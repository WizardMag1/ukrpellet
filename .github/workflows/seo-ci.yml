name: SEO & Site Integrity CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Checks and tests (npm test - SEO check, lead API, phone, fuel rule, webhook, bot sync, Worker config)
        run: npm test
      - name: Pages in step with the shared layout and styles.css (re-run scripts/sync-layout.cjs if this fails)
        run: node scripts/sync-layout.cjs && git diff --exit-code -- '*.html'
