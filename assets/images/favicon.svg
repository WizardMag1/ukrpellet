<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4efe6"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba8254"/>
      <stop offset="100%" stop-color="#6e3f1e"/>
    </linearGradient>
    <linearGradient id="woodTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8a47f"/>
      <stop offset="100%" stop-color="#966138"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#143d22" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background App Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#e2ddd4" stroke-width="1.5"/>

  <!-- Wood Pellet Cylinder -->
  <g filter="url(#shadow)">
    <!-- Pellet Body -->
    <path d="M16 23 C16 20 28 20 28 23 L28 42 C28 46 16 46 16 42 Z" fill="url(#woodGrad)"/>
    <!-- Pellet Top Ellipse -->
    <ellipse cx="22" cy="23" rx="6" ry="3.5" fill="url(#woodTopGrad)" stroke="#6e3f1e" stroke-width="0.8"/>
    <!-- Annual Ring Detail -->
    <ellipse cx="22" cy="23" rx="3.5" ry="2" fill="none" stroke="#ba8254" stroke-width="0.75" opacity="0.8"/>
  </g>

  <!-- Clean Energy Flame Spark -->
  <path d="M33 26 C33 26 36 21 34 16 C37 18 39 21 37 25 C38 23 40 22 39 20 C42 23 41 27 38 29 C35 30 33 28 33 26 Z" fill="url(#flameGrad)"/>

  <!-- Eco Leaf -->
  <path d="M24 47 C24 47 31 49 39 44 C47 39 49 27 49 20 C45 22 35 24 29 33 C26 37 24 42 24 47 Z" fill="url(#leafGrad)"/>
  <!-- Leaf Central Vein -->
  <path d="M24 47 C30 43 38 34 49 20" stroke="#bbf7d0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
