name: SEO & Site Integrity CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: SEO check (sitemap, canonicals, JSON-LD, links, stale domains)
        run: npm run check
      - name: Lead API syntax
        run: node --check api/lead.js
      - name: Diesel price rule tests
        run: node scripts/update-fuel.test.cjs
      - name: Worker config in step (root and cloudflare/)
        run: node scripts/check-wrangler.cjs
