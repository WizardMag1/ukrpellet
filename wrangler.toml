# Cloudflare Workers Builds runs from the repo root, so wrangler looks for its config here.
# Same settings as cloudflare/wrangler.toml (scripts/check-wrangler.cjs fails CI if they drift).
name = "ukrecopelleta-edge"
main = "cloudflare/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
# Worker Previews (Cloudflare branch builds run `wrangler preview`) get a noindex workers.dev URL
preview_urls = true

# Custom domains: Cloudflare creates the DNS records for these automatically
routes = [
  { pattern = "ukrecopelleta.org", custom_domain = true },
  { pattern = "www.ukrecopelleta.org", custom_domain = true }
]

# KV store for dynamic pricing, delivery tariffs, and Telegram bot state
kv_namespaces = [
  { binding = "PRICING_KV", id = "ukrecopelleta_pricing_kv" }
]

[vars]
ORIGIN = "ukrpellet-ua.vercel.app"
CANONICAL_HOST = "ukrecopelleta.org"
TELEGRAM_BOT_TOKEN = "8962858456:AAF0rwGGHsK6ViCBvqELVJeSnU19pe-wajw"
TELEGRAM_ADMIN_ID = "788872538"
TELEGRAM_BOT_USERNAME = "ukrecopelleta_bot"
TELEGRAM_WEBHOOK_SECRET = "ukr_sec_98890c83_pelleta"

# Previews don't inherit the production settings above. No CANONICAL_HOST: a preview answers on its own
# workers.dev URL instead of redirecting to the live domain. Production routes never apply to previews.
[previews.vars]
ORIGIN = "ukrpellet-ua.vercel.app"
CANONICAL_HOST = ""
TELEGRAM_BOT_TOKEN = "8962858456:AAF0rwGGHsK6ViCBvqELVJeSnU19pe-wajw"
TELEGRAM_ADMIN_ID = "788872538"
TELEGRAM_BOT_USERNAME = "ukrecopelleta_bot"
TELEGRAM_WEBHOOK_SECRET = "ukr_sec_98890c83_pelleta"
